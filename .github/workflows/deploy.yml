# LAB COPY of the Flowa website. Builds and publishes to GitHub Pages on
# every push to main, at https://azam-stack.github.io/flowa-website-lab/.
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". Do NOT set a custom domain here: flowa.dk belongs to
# azam-stack/flowa-website.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # LAB COPY: served at azam-stack.github.io/flowa-website-lab/, never at
          # flowa.dk. There is deliberately no public/CNAME in this repository.
          VITE_BASE: /flowa-website-lab/
          # Lead endpoint (backend/ worker), booking link and analytics sink (see README).
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
          VITE_BOOKING_URL: ${{ vars.VITE_BOOKING_URL }}
          VITE_ANALYTICS_ENDPOINT: ${{ vars.VITE_ANALYTICS_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
