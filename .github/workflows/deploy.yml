# LAB COPY. Builds the Frank draft and publishes it to GitHub Pages on
# every push to main. One-time setup in this repository: Settings → Pages
# → Build and deployment → Source: "GitHub Actions". The draft then lives
# at https://azam-stack.github.io/flowa-website-lab/ with noindex on
# every page. It never touches flowa.dk, its DNS, its forms or its
# endpoints.
name: Deploy draft to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Served under the repository path on GitHub Pages.
          VITE_BASE: /flowa-website-lab/
          VITE_SITE_URL: https://azam-stack.github.io/flowa-website-lab
          # The draft's own lead endpoint and the client dashboard link (Settings → Variables). Both optional.
          # Lead endpoint for this repo (repository variables are per repo, so the live site's value is never read here).
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
          VITE_ASK_ENDPOINT: ${{ vars.VITE_ASK_ENDPOINT }}
          VITE_BOOKING_URL: ${{ vars.VITE_BOOKING_URL }}
          VITE_CLIENT_DASHBOARD_URL: ${{ vars.VITE_CLIENT_DASHBOARD_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
